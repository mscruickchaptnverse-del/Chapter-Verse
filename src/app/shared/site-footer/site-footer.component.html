<footer
  class="border-t border-cv-green/10 bg-cv-footer-bg/85 px-[clamp(1rem,4vw,1.5rem)] py-12 backdrop-blur-sm sm:py-16 md:py-20"
>
  <div class="mx-auto max-w-4xl text-center">
    <p class="font-serif text-xl font-semibold text-cv-charcoal md:text-2xl">Chapter &amp; Verse</p>
    <p class="mx-auto mt-6 max-w-2xl text-[0.62rem] font-medium uppercase leading-relaxed tracking-[0.22em] text-neutral-700">
      Curating high-end essentials for every transition, role, and best9 period in a woman&apos;s life.
    </p>

    <nav class="mt-10 flex flex-wrap justify-center gap-x-10 gap-y-3 text-[0.65rem] uppercase tracking-[0.18em]" aria-label="Footer">
      <a href="#" class="border-b border-cv-charcoal/25 pb-0.5 text-neutral-700 no-underline transition hover:text-cv-sage-accent"
        >Terms &amp; Policy</a
      >
      <a
        *ngIf="!hideContactUsLink"
        routerLink="/contact"
        class="border-b border-cv-charcoal/25 pb-0.5 text-neutral-700 no-underline transition hover:text-cv-sage-accent"
        >Contact Us</a
      >
      <a
        *ngIf="!hideAdminLink && adminSignInIsExternal"
        [href]="adminSignInHref"
        class="border-b border-cv-charcoal/25 pb-0.5 text-neutral-700 no-underline transition hover:text-cv-sage-accent"
        >Admin</a
      >
      <a
        *ngIf="!hideAdminLink && !adminSignInIsExternal"
        routerLink="/sign-in"
        class="border-b border-cv-charcoal/25 pb-0.5 text-neutral-700 no-underline transition hover:text-cv-sage-accent"
        >Admin</a
      >
    </nav>

    <div class="mt-10 flex justify-center gap-10 text-cv-sage-accent" aria-hidden="true">
      <svg class="h-7 w-7" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.15" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 5v14M9 8c-3 0-5 2.5-5 5s2 5 5 5 5-2 5-5-2-5-5-5zm6 0c3 0 5 2.5 5 5s-2 5-5 5-5-2-5-5 2-5 5-5z" />
      </svg>
      <svg class="h-7 w-7" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.15" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 21s-7-4.35-7-10a5 5 0 0 1 9.6-2 5 5 0 0 1 9.4 2c0 5.65-7 10-7 10z" />
      </svg>
      <svg class="h-7 w-7" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.15" stroke-linecap="round">
        <circle cx="12" cy="12" r="2" fill="currentColor" />
        <path d="M12 4v4M12 16v4M4 12h4M16 12h4M6.34 6.34l2.83 2.83M14.83 14.83l2.83 2.83M17.66 6.34l-2.83 2.83M9.17 14.83l-2.83 2.83" />
      </svg>
    </div>

    <p class="mt-12 text-[0.65rem] uppercase tracking-[0.12em] text-neutral-700">
      &copy; 2026 Chapter &amp; Verse Charters, LLC. All rights reserved.
    </p>
  </div>
</footer>
