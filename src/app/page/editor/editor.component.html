<div class="min-h-screen bg-cv-page/70 text-cv-charcoal">
  <main class="mx-auto w-full max-w-[1250px] px-5 py-6 md:px-8">
    <section class="rounded-xl border border-cv-sage-accent/20 bg-cv-cream/85 p-4 shadow-sm backdrop-blur-sm md:p-6">
      <header class="flex flex-wrap items-center justify-between gap-4">
        <div>
          <h1 class="font-serif text-3xl italic text-cv-green">Editor&apos;s Console</h1>
          <p class="text-[0.62rem] font-semibold uppercase tracking-[0.2em] text-cv-muted">
            Curate the digital presence
          </p>
        </div>
        <div class="flex items-center gap-3">
          <button
            type="button"
            class="rounded-md border border-cv-sage-accent/35 px-4 py-2 text-[0.62rem] font-semibold uppercase tracking-[0.16em] text-cv-grey transition hover:bg-white/50"
            (click)="logout()"
          >
            Sign out
          </button>
          <button
            type="button"
            class="rounded-md border border-cv-sage-accent/35 px-4 py-2 text-[0.62rem] font-semibold uppercase tracking-[0.16em] text-cv-grey transition hover:bg-white/50"
            (click)="discardChanges()"
          >
            Discard
          </button>
          <button
            type="button"
            class="rounded-md bg-cv-green px-5 py-2 text-[0.62rem] font-semibold uppercase tracking-[0.16em] text-white shadow-sm transition hover:opacity-90 disabled:cursor-not-allowed disabled:opacity-60"
            [disabled]="!hasChanges"
            (click)="publishChanges()"
          >
            Publish Changes
          </button>
        </div>
      </header>

      <div
        class="sticky top-3 z-40 mt-4 border border-cv-sage-accent/15 bg-white/95 px-3 py-2 shadow-sm backdrop-blur-sm"
      >
        <div class="flex flex-wrap items-center justify-between gap-3">
          <div class="flex flex-wrap items-center gap-2">
            <div class="flex items-center gap-1 pr-2">
            <button
              type="button"
              class="rounded px-2 py-1 text-sm font-semibold transition"
              [ngClass]="{ 'bg-cv-green/10': isBold }"
              [class.text-cv-green]="isBold"
              [class.text-cv-grey]="!isBold"
              (mousedown)="keepFieldFocus($event)"
              (click)="toggleBold()"
            >
              B
            </button>
            <button
              type="button"
              class="rounded px-2 py-1 text-sm italic transition"
              [ngClass]="{ 'bg-cv-green/10': isItalic }"
              [class.text-cv-green]="isItalic"
              [class.text-cv-grey]="!isItalic"
              (mousedown)="keepFieldFocus($event)"
              (click)="toggleItalic()"
            >
              I
            </button>
            <button
              type="button"
              class="rounded px-2 py-1 text-sm underline transition"
              [ngClass]="{ 'bg-cv-green/10': isUnderline }"
              [class.text-cv-green]="isUnderline"
              [class.text-cv-grey]="!isUnderline"
              (mousedown)="keepFieldFocus($event)"
              (click)="toggleUnderline()"
            >
              U
            </button>
            </div>

            <div class="flex items-center gap-2 border-l border-cv-sage-accent/20 pl-3">
            <select
              class="rounded border border-cv-sage-accent/25 bg-white px-2 py-1 text-[0.68rem] uppercase tracking-[0.12em] text-cv-grey"
              (change)="updateFont($event)"
            >
              <option>Newsreader</option>
              <option>Inter</option>
              <option>Playfair Display</option>
            </select>
            <select
              class="rounded border border-cv-sage-accent/25 bg-white px-2 py-1 text-[0.68rem] text-cv-grey"
              (change)="updateSize($event)"
            >
              <option>14px</option>
              <option selected>16px</option>
              <option>18px</option>
              <option>24px</option>
            </select>
            </div>

            <div class="flex items-center gap-1 border-l border-cv-sage-accent/20 pl-3">
              <button
                type="button"
                class="rounded px-2 py-1 text-sm transition"
                [ngClass]="{ 'bg-cv-green/10': isUnderline }"
                [class.text-cv-green]="isUnderline"
                [class.text-cv-grey]="!isUnderline"
                (mousedown)="keepFieldFocus($event)"
                (click)="toggleUnderline()"
                aria-label="Text color accent"
              >
                A
              </button>
            </div>

            <div class="flex items-center gap-1 border-l border-cv-sage-accent/20 pl-3">
            <button
              type="button"
              class="rounded px-2 py-1 text-sm transition"
              [ngClass]="{ 'bg-cv-green/10': textAlign==='left' }"
              [class.text-cv-green]="textAlign==='left'"
              [class.text-cv-grey]="textAlign!=='left'"
              (mousedown)="keepFieldFocus($event)"
              (click)="setTextAlign('left')"
              aria-label="Align left"
            >
              ☰
            </button>
            <button
              type="button"
              class="rounded px-2 py-1 text-sm transition"
              [ngClass]="{ 'bg-cv-green/10': textAlign==='center' }"
              [class.text-cv-green]="textAlign==='center'"
              [class.text-cv-grey]="textAlign!=='center'"
              (mousedown)="keepFieldFocus($event)"
              (click)="setTextAlign('center')"
              aria-label="Align center"
            >
              ≡
            </button>
            <button
              type="button"
              class="rounded px-2 py-1 text-sm transition"
              [ngClass]="{ 'bg-cv-green/10': textAlign==='right' }"
              [class.text-cv-green]="textAlign==='right'"
              [class.text-cv-grey]="textAlign!=='right'"
              (mousedown)="keepFieldFocus($event)"
              (click)="setTextAlign('right')"
              aria-label="Align right"
            >
              ☷
            </button>
            </div>

            <div class="flex items-center gap-1 border-l border-cv-sage-accent/20 pl-3">
              <button type="button" class="rounded px-2 py-1 text-sm text-cv-grey transition hover:bg-cv-green/10 hover:text-cv-green" aria-label="Bullet list" (mousedown)="keepFieldFocus($event)">•</button>
              <button type="button" class="rounded px-2 py-1 text-sm text-cv-grey transition hover:bg-cv-green/10 hover:text-cv-green" aria-label="Numbered list" (mousedown)="keepFieldFocus($event)">1.</button>
            </div>
          </div>

          <div class="flex items-center gap-1 border-l border-cv-sage-accent/20 pl-3">
            <button type="button" class="rounded px-2 py-1 text-sm text-cv-grey transition hover:bg-cv-green/10 hover:text-cv-green" aria-label="Undo" (mousedown)="keepFieldFocus($event)">↺</button>
            <button type="button" class="rounded px-2 py-1 text-sm text-cv-grey transition hover:bg-cv-green/10 hover:text-cv-green" aria-label="Redo" (mousedown)="keepFieldFocus($event)">↻</button>
          </div>
        </div>
      </div>

      <div class="mt-5 grid gap-4 md:grid-cols-2">
        <article class="rounded-lg border border-cv-sage-accent/20 bg-cv-shell/70 p-4">
          <h2 class="mb-4 font-serif text-xl text-cv-green">Main Headline</h2>
          <label class="mb-1 block text-[0.6rem] uppercase tracking-[0.16em] text-cv-muted">Eyebrow</label>
          <input
            class="mb-3 w-full border-0 border-b border-cv-grey/35 bg-transparent py-2 text-sm text-cv-charcoal outline-none focus:border-cv-green"
            [ngClass]="fieldClassMap('heroEyebrow')"
            [style.fontSize]="fieldFontSize('heroEyebrow')"
            [value]="form.heroEyebrow"
            (focus)="setActiveField('heroEyebrow')"
            (input)="onInput('heroEyebrow', $event)"
          />
          <label class="mb-1 block text-[0.6rem] uppercase tracking-[0.16em] text-cv-muted">Title line 1</label>
          <input
            class="mb-3 w-full border-0 border-b border-cv-grey/35 bg-transparent py-2 text-sm text-cv-charcoal outline-none focus:border-cv-green"
            [ngClass]="fieldClassMap('heroTitleTop')"
            [style.fontSize]="fieldFontSize('heroTitleTop')"
            [value]="form.heroTitleTop"
            (focus)="setActiveField('heroTitleTop')"
            (input)="onInput('heroTitleTop', $event)"
          />
          <label class="mb-1 block text-[0.6rem] uppercase tracking-[0.16em] text-cv-muted">Title line 2</label>
          <input
            class="mb-3 w-full border-0 border-b border-cv-grey/35 bg-transparent py-2 text-sm text-cv-charcoal outline-none focus:border-cv-green"
            [ngClass]="fieldClassMap('heroTitleBottom')"
            [style.fontSize]="fieldFontSize('heroTitleBottom')"
            [value]="form.heroTitleBottom"
            (focus)="setActiveField('heroTitleBottom')"
            (input)="onInput('heroTitleBottom', $event)"
          />
          <label class="mb-1 block text-[0.6rem] uppercase tracking-[0.16em] text-cv-muted">Subtext</label>
          <textarea
            rows="3"
            class="w-full resize-y border border-cv-grey/25 bg-white/70 p-2 text-sm text-cv-grey outline-none focus:border-cv-green"
            [ngClass]="fieldClassMap('heroBody')"
            [style.fontSize]="fieldFontSize('heroBody')"
            [value]="form.heroBody"
            (focus)="setActiveField('heroBody')"
            (input)="onInput('heroBody', $event)"
          ></textarea>
          <label class="mb-1 mt-3 block text-[0.6rem] uppercase tracking-[0.16em] text-cv-muted">Primary CTA</label>
          <input
            class="mb-2 w-full border-0 border-b border-cv-grey/35 bg-transparent py-2 text-sm text-cv-charcoal outline-none focus:border-cv-green"
            [ngClass]="fieldClassMap('heroPrimaryCta')"
            [style.fontSize]="fieldFontSize('heroPrimaryCta')"
            [value]="form.heroPrimaryCta"
            (focus)="setActiveField('heroPrimaryCta')"
            (input)="onInput('heroPrimaryCta', $event)"
          />
          <label class="mb-1 block text-[0.6rem] uppercase tracking-[0.16em] text-cv-muted">Secondary CTA</label>
          <input
            class="w-full border-0 border-b border-cv-grey/35 bg-transparent py-2 text-sm text-cv-charcoal outline-none focus:border-cv-green"
            [ngClass]="fieldClassMap('heroSecondaryCta')"
            [style.fontSize]="fieldFontSize('heroSecondaryCta')"
            [value]="form.heroSecondaryCta"
            (focus)="setActiveField('heroSecondaryCta')"
            (input)="onInput('heroSecondaryCta', $event)"
          />
        </article>

        <article class="rounded-lg border border-cv-sage-accent/20 bg-cv-shell/70 p-4">
          <h2 class="mb-4 font-serif text-xl text-cv-green">Our Story</h2>
          <label class="mb-1 block text-[0.6rem] uppercase tracking-[0.16em] text-cv-muted">Heading line 1</label>
          <input
            class="mb-3 w-full border-0 border-b border-cv-grey/35 bg-transparent py-2 text-sm text-cv-charcoal outline-none focus:border-cv-green"
            [ngClass]="fieldClassMap('philosophyHeadingLine1')"
            [style.fontSize]="fieldFontSize('philosophyHeadingLine1')"
            [value]="form.philosophyHeadingLine1"
            (focus)="setActiveField('philosophyHeadingLine1')"
            (input)="onInput('philosophyHeadingLine1', $event)"
          />
          <label class="mb-1 block text-[0.6rem] uppercase tracking-[0.16em] text-cv-muted">Accent word</label>
          <input
            class="mb-3 w-full border-0 border-b border-cv-grey/35 bg-transparent py-2 text-sm text-cv-charcoal outline-none focus:border-cv-green"
            [ngClass]="fieldClassMap('philosophyHeadingAccent')"
            [style.fontSize]="fieldFontSize('philosophyHeadingAccent')"
            [value]="form.philosophyHeadingAccent"
            (focus)="setActiveField('philosophyHeadingAccent')"
            (input)="onInput('philosophyHeadingAccent', $event)"
          />
          <label class="mb-1 block text-[0.6rem] uppercase tracking-[0.16em] text-cv-muted">Intro</label>
          <textarea
            rows="5"
            class="w-full resize-y border border-cv-grey/25 bg-white/70 p-2 text-sm text-cv-grey outline-none focus:border-cv-green"
            [ngClass]="fieldClassMap('philosophyIntro')"
            [style.fontSize]="fieldFontSize('philosophyIntro')"
            [value]="form.philosophyIntro"
            (focus)="setActiveField('philosophyIntro')"
            (input)="onInput('philosophyIntro', $event)"
          ></textarea>
        </article>
      </div>

      <div class="mt-6 grid gap-4 md:grid-cols-2">
        <article class="rounded-lg border border-cv-sage-accent/20 bg-cv-shell/70 p-4">
          <h2 class="mb-4 font-serif text-xl text-cv-green">Philosophy details</h2>
          <label class="mb-1 block text-[0.6rem] uppercase tracking-[0.16em] text-cv-muted">Quote</label>
          <textarea
            rows="2"
            class="mb-3 w-full resize-y border border-cv-grey/25 bg-white/70 p-2 text-sm text-cv-charcoal outline-none focus:border-cv-green"
            [ngClass]="fieldClassMap('philosophyQuote')"
            [style.fontSize]="fieldFontSize('philosophyQuote')"
            [value]="form.philosophyQuote"
            (focus)="setActiveField('philosophyQuote')"
            (input)="onInput('philosophyQuote', $event)"
          ></textarea>
          <label class="mb-1 block text-[0.6rem] uppercase tracking-[0.16em] text-cv-muted">Quote label</label>
          <input
            class="mb-3 w-full border-0 border-b border-cv-grey/35 bg-transparent py-2 text-sm text-cv-charcoal outline-none focus:border-cv-green"
            [ngClass]="fieldClassMap('philosophyQuoteLabel')"
            [style.fontSize]="fieldFontSize('philosophyQuoteLabel')"
            [value]="form.philosophyQuoteLabel"
            (focus)="setActiveField('philosophyQuoteLabel')"
            (input)="onInput('philosophyQuoteLabel', $event)"
          />
          <label class="mb-1 block text-[0.6rem] uppercase tracking-[0.16em] text-cv-muted">Paragraph 1</label>
          <textarea
            rows="3"
            class="mb-3 w-full resize-y border border-cv-grey/25 bg-white/70 p-2 text-sm text-cv-grey outline-none focus:border-cv-green"
            [ngClass]="fieldClassMap('philosophyParagraph1')"
            [style.fontSize]="fieldFontSize('philosophyParagraph1')"
            [value]="form.philosophyParagraph1"
            (focus)="setActiveField('philosophyParagraph1')"
            (input)="onInput('philosophyParagraph1', $event)"
          ></textarea>
          <label class="mb-1 block text-[0.6rem] uppercase tracking-[0.16em] text-cv-muted">Paragraph 2</label>
          <textarea
            rows="3"
            class="w-full resize-y border border-cv-grey/25 bg-white/70 p-2 text-sm text-cv-grey outline-none focus:border-cv-green"
            [ngClass]="fieldClassMap('philosophyParagraph2')"
            [style.fontSize]="fieldFontSize('philosophyParagraph2')"
            [value]="form.philosophyParagraph2"
            (focus)="setActiveField('philosophyParagraph2')"
            (input)="onInput('philosophyParagraph2', $event)"
          ></textarea>
        </article>

        <article class="rounded-lg border border-cv-sage-accent/20 bg-cv-shell/70 p-4">
          <h2 class="mb-4 font-serif text-xl text-cv-green">Testimonial</h2>
          <label class="mb-1 block text-[0.6rem] uppercase tracking-[0.16em] text-cv-muted">Quote</label>
          <textarea
            rows="5"
            class="mb-3 w-full resize-y border border-cv-grey/25 bg-white/70 p-2 text-sm text-cv-grey outline-none focus:border-cv-green"
            [ngClass]="fieldClassMap('testimonialQuote')"
            [style.fontSize]="fieldFontSize('testimonialQuote')"
            [value]="form.testimonialQuote"
            (focus)="setActiveField('testimonialQuote')"
            (input)="onInput('testimonialQuote', $event)"
          ></textarea>
          <label class="mb-1 block text-[0.6rem] uppercase tracking-[0.16em] text-cv-muted">Name</label>
          <input
            class="mb-3 w-full border-0 border-b border-cv-grey/35 bg-transparent py-2 text-sm text-cv-charcoal outline-none focus:border-cv-green"
            [ngClass]="fieldClassMap('testimonialName')"
            [style.fontSize]="fieldFontSize('testimonialName')"
            [value]="form.testimonialName"
            (focus)="setActiveField('testimonialName')"
            (input)="onInput('testimonialName', $event)"
          />
          <label class="mb-1 block text-[0.6rem] uppercase tracking-[0.16em] text-cv-muted">Subtitle</label>
          <input
            class="w-full border-0 border-b border-cv-grey/35 bg-transparent py-2 text-sm text-cv-charcoal outline-none focus:border-cv-green"
            [ngClass]="fieldClassMap('testimonialSubtitle')"
            [style.fontSize]="fieldFontSize('testimonialSubtitle')"
            [value]="form.testimonialSubtitle"
            (focus)="setActiveField('testimonialSubtitle')"
            (input)="onInput('testimonialSubtitle', $event)"
          />
        </article>
      </div>

      <section class="mt-6 rounded-lg border border-cv-sage-accent/20 bg-cv-shell/70 p-4">
        <h2 class="mb-4 font-serif text-xl text-cv-green">Values &amp; Ethos</h2>
        <div class="grid gap-3 sm:grid-cols-2 lg:grid-cols-4">
          <article class="rounded-md border border-cv-sage-accent/20 bg-white p-3">
            <p class="text-[0.52rem] uppercase tracking-[0.16em] text-cv-muted">Card Title</p>
            <input
              class="mt-1 w-full border-0 border-b border-cv-grey/30 bg-transparent text-sm font-semibold text-cv-charcoal outline-none focus:border-cv-green"
              [ngClass]="fieldClassMap('valuesCard1Title')"
              [style.fontSize]="fieldFontSize('valuesCard1Title')"
              [value]="form.valuesCard1Title"
              (focus)="setActiveField('valuesCard1Title')"
              (input)="onInput('valuesCard1Title', $event)"
            />
            <textarea
              rows="2"
              class="mt-2 w-full resize-y border-0 bg-transparent text-xs text-cv-grey outline-none"
              [ngClass]="fieldClassMap('valuesCard1Body')"
              [style.fontSize]="fieldFontSize('valuesCard1Body')"
              [value]="form.valuesCard1Body"
              (focus)="setActiveField('valuesCard1Body')"
              (input)="onInput('valuesCard1Body', $event)"
            ></textarea>
          </article>
          <article class="rounded-md border border-cv-sage-accent/20 bg-white p-3">
            <p class="text-[0.52rem] uppercase tracking-[0.16em] text-cv-muted">Card Title</p>
            <input
              class="mt-1 w-full border-0 border-b border-cv-grey/30 bg-transparent text-sm font-semibold text-cv-charcoal outline-none focus:border-cv-green"
              [ngClass]="fieldClassMap('valuesCard2Title')"
              [style.fontSize]="fieldFontSize('valuesCard2Title')"
              [value]="form.valuesCard2Title"
              (focus)="setActiveField('valuesCard2Title')"
              (input)="onInput('valuesCard2Title', $event)"
            />
            <textarea
              rows="2"
              class="mt-2 w-full resize-y border-0 bg-transparent text-xs text-cv-grey outline-none"
              [ngClass]="fieldClassMap('valuesCard2Body')"
              [style.fontSize]="fieldFontSize('valuesCard2Body')"
              [value]="form.valuesCard2Body"
              (focus)="setActiveField('valuesCard2Body')"
              (input)="onInput('valuesCard2Body', $event)"
            ></textarea>
          </article>
          <article class="rounded-md border border-cv-sage-accent/20 bg-white p-3">
            <p class="text-[0.52rem] uppercase tracking-[0.16em] text-cv-muted">Card Title</p>
            <input
              class="mt-1 w-full border-0 border-b border-cv-grey/30 bg-transparent text-sm font-semibold text-cv-charcoal outline-none focus:border-cv-green"
              [ngClass]="fieldClassMap('valuesCard3Title')"
              [style.fontSize]="fieldFontSize('valuesCard3Title')"
              [value]="form.valuesCard3Title"
              (focus)="setActiveField('valuesCard3Title')"
              (input)="onInput('valuesCard3Title', $event)"
            />
            <textarea
              rows="2"
              class="mt-2 w-full resize-y border-0 bg-transparent text-xs text-cv-grey outline-none"
              [ngClass]="fieldClassMap('valuesCard3Body')"
              [style.fontSize]="fieldFontSize('valuesCard3Body')"
              [value]="form.valuesCard3Body"
              (focus)="setActiveField('valuesCard3Body')"
              (input)="onInput('valuesCard3Body', $event)"
            ></textarea>
          </article>
          <article class="rounded-md border border-cv-sage-accent/20 bg-white p-3">
            <p class="text-[0.52rem] uppercase tracking-[0.16em] text-cv-muted">Card Title</p>
            <input
              class="mt-1 w-full border-0 border-b border-cv-grey/30 bg-transparent text-sm font-semibold text-cv-charcoal outline-none focus:border-cv-green"
              [ngClass]="fieldClassMap('valuesCard4Title')"
              [style.fontSize]="fieldFontSize('valuesCard4Title')"
              [value]="form.valuesCard4Title"
              (focus)="setActiveField('valuesCard4Title')"
              (input)="onInput('valuesCard4Title', $event)"
            />
            <textarea
              rows="2"
              class="mt-2 w-full resize-y border-0 bg-transparent text-xs text-cv-grey outline-none"
              [ngClass]="fieldClassMap('valuesCard4Body')"
              [style.fontSize]="fieldFontSize('valuesCard4Body')"
              [value]="form.valuesCard4Body"
              (focus)="setActiveField('valuesCard4Body')"
              (input)="onInput('valuesCard4Body', $event)"
            ></textarea>
          </article>
        </div>
      </section>

      <div class="mt-6 grid gap-4 md:grid-cols-2">
        <article class="rounded-lg border border-cv-sage-accent/20 bg-cv-shell/70 p-4">
          <h2 class="mb-3 font-serif text-xl text-cv-green">Our Promise</h2>
          <label class="mb-1 block text-[0.6rem] uppercase tracking-[0.16em] text-cv-muted">Callout</label>
          <textarea
            rows="4"
            class="w-full resize-y border border-cv-grey/25 bg-white/70 p-2 text-sm italic text-cv-charcoal outline-none focus:border-cv-green"
            [ngClass]="fieldClassMap('philosophyPullQuote')"
            [style.fontSize]="fieldFontSize('philosophyPullQuote')"
            [value]="form.philosophyPullQuote"
            (focus)="setActiveField('philosophyPullQuote')"
            (input)="onInput('philosophyPullQuote', $event)"
          ></textarea>
          <label class="mb-1 mt-3 block text-[0.6rem] uppercase tracking-[0.16em] text-cv-muted">Attribution</label>
          <input
            class="w-full border-0 border-b border-cv-grey/35 bg-transparent py-2 text-sm text-cv-charcoal outline-none focus:border-cv-green"
            value="Chapter & Verse Editorial Board"
            readonly
          />
        </article>

        <article class="rounded-lg border border-cv-sage-accent/20 bg-cv-shell/70 p-4">
          <h2 class="mb-3 font-serif text-xl text-cv-green">Charters CTA</h2>
          <label class="mb-1 block text-[0.6rem] uppercase tracking-[0.16em] text-cv-muted">Headline</label>
          <input
            class="mb-3 w-full border-0 border-b border-cv-grey/35 bg-transparent py-2 text-sm text-cv-charcoal outline-none focus:border-cv-green"
            [ngClass]="fieldClassMap('chartersTitle')"
            [style.fontSize]="fieldFontSize('chartersTitle')"
            [value]="form.chartersTitle"
            (focus)="setActiveField('chartersTitle')"
            (input)="onInput('chartersTitle', $event)"
          />
          <label class="mb-1 block text-[0.6rem] uppercase tracking-[0.16em] text-cv-muted">Body</label>
          <textarea
            rows="3"
            class="mb-3 w-full resize-y border border-cv-grey/25 bg-white/70 p-2 text-sm text-cv-grey outline-none focus:border-cv-green"
            [ngClass]="fieldClassMap('chartersBody')"
            [style.fontSize]="fieldFontSize('chartersBody')"
            [value]="form.chartersBody"
            (focus)="setActiveField('chartersBody')"
            (input)="onInput('chartersBody', $event)"
          ></textarea>
          <label class="mb-1 block text-[0.6rem] uppercase tracking-[0.16em] text-cv-muted">Button label</label>
          <input
            class="w-full border-0 border-b border-cv-grey/35 bg-transparent py-2 text-sm text-cv-charcoal outline-none focus:border-cv-green"
            [ngClass]="fieldClassMap('chartersButton')"
            [style.fontSize]="fieldFontSize('chartersButton')"
            [value]="form.chartersButton"
            (focus)="setActiveField('chartersButton')"
            (input)="onInput('chartersButton', $event)"
          />
          <label class="mb-1 mt-3 block text-[0.6rem] uppercase tracking-[0.16em] text-cv-muted">Button link (URL)</label>
          <input
            class="w-full border-0 border-b border-cv-grey/35 bg-transparent py-2 text-sm text-cv-charcoal outline-none focus:border-cv-green"
            [ngClass]="fieldClassMap('chartersButtonLink')"
            [style.fontSize]="fieldFontSize('chartersButtonLink')"
            [value]="form.chartersButtonLink"
            (focus)="setActiveField('chartersButtonLink')"
            (input)="onInput('chartersButtonLink', $event)"
            placeholder="/shop, https://..., or www..."
          />
        </article>
      </div>

      <p *ngIf="saveMessage" class="mt-3 text-xs text-cv-muted">{{ saveMessage }}</p>
    </section>
  </main>

  <app-site-footer></app-site-footer>
</div>
