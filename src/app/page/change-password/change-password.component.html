<div class="min-h-screen min-w-0 overflow-x-hidden bg-cv-page/70 px-[clamp(0.75rem,3vw,1.25rem)] py-8 text-cv-charcoal sm:px-5 sm:py-10">
  <main class="mx-auto w-full min-w-0 max-w-xl rounded-xl border border-cv-sage-accent/20 bg-cv-cream/90 p-4 sm:p-6">
    <h1 class="font-serif text-3xl italic text-cv-green">Set New Password</h1>
    <p class="mt-2 text-sm text-cv-muted">
      This is your first sign-in. Set a new password to continue.
    </p>

    <form class="mt-6 space-y-4" (submit)="submit($event)">
      <div>
        <label class="mb-1 block text-[0.65rem] uppercase tracking-[0.16em] text-cv-muted">New password</label>
        <input
          name="password"
          type="password"
          autocomplete="new-password"
          class="w-full border border-cv-sage-accent/30 bg-white/80 px-3 py-2 text-sm outline-none focus:border-cv-green"
        />
      </div>
      <div>
        <label class="mb-1 block text-[0.65rem] uppercase tracking-[0.16em] text-cv-muted">Confirm password</label>
        <input
          name="confirmPassword"
          type="password"
          autocomplete="new-password"
          class="w-full border border-cv-sage-accent/30 bg-white/80 px-3 py-2 text-sm outline-none focus:border-cv-green"
        />
      </div>

      <button
        type="submit"
        class="rounded-md bg-cv-green px-5 py-2 text-[0.65rem] font-semibold uppercase tracking-[0.14em] text-white disabled:cursor-not-allowed disabled:opacity-70"
        [disabled]="submitting"
      >
        Save password
      </button>
    </form>

    <p *ngIf="errorMessage" class="mt-3 text-sm text-red-700">{{ errorMessage }}</p>
    <p *ngIf="successMessage" class="mt-3 text-sm text-cv-green">{{ successMessage }}</p>
  </main>
</div>
